[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pruefung"
version = "0.1.6"
description = "Agent-first EDSL exam authoring, quality-control, deployment, and grading CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Expected Parrot, Inc."}]
keywords = ["assessment", "education", "edsl", "exams", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "click>=8.1",
  "rich>=13",
  "edsl>=1.0.8",
  "pypdf>=4",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pruefung = "pruefung.cli:main"

[project.urls]
Homepage = "https://github.com/expectedparrot/pruefung"
Repository = "https://github.com/expectedparrot/pruefung"
Issues = "https://github.com/expectedparrot/pruefung/issues"

[tool.setuptools.packages.find]
include = ["pruefung*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
